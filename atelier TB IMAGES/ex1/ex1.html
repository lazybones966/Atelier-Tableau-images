<!DOCTYPE html>
<html>
   <head>
         <meta charset="utf-8" />
         <title>Exercice 1</title>
         <link href="style.css" rel="stylesheet">
   </head>
<body>
   <!-- <table> : crée un tableau -->
   <table>
       <!-- <caption> : donne un titre au tableau -->
       <caption> Répartition des étudiants</caption>

       <!-- <tr> : (table row) crée une ligne du tableau -->
       <tr>
           <!-- <th> : (table header) cellule d'en-tête, texte en gras et centré -->
           <th> Classe </th> <th> TI 101 </th> <th> TI 102 </th> <th> TI 105 </th>
       </tr>
       <tr>
           <th> Nombre </th>
           <!-- <td> : (table data) cellule normale contenant une donnée -->
           <td> 28 </td> <td> 25 </td> <td> 29 </td>
       </tr>
   </table>

</body>
</html>
